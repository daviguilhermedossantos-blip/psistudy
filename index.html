<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Psistudy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-container">
        <!-- Topo com Logo e Level (Fixo) -->
        <header id="perfil-topo" style="display: none;">
            <div class="logo">Ψ PSISTUDY</div>
            <div class="user-avatar">
                <img src="https://ui-avatars.com/api/?name=User&background=fff&color=333" alt="Avatar" id="avatar-img">
                <span class="level">80</span>
            </div>
        </header>

        <!-- Área onde as telas mudam -->
        <main id="app-content"></main>

        <!-- Menu Inferior -->
        <nav id="tabbar">
            <button class="tab-btn active" data-module="inicio"><span style="font-size: 1.5em;">🏠</span>Início</button>
            <button class="tab-btn" data-module="materias"><span style="font-size: 1.5em;">📚</span>Matérias</button>
            <button class="tab-btn" data-module="estudo"><span style="font-size: 1.5em;">📖</span>Estudo</button>
            <button class="tab-btn" data-module="paciente"><span style="font-size: 1.5em;">🧠</span>Paciente</button>
            <button class="tab-btn" data-module="perfil"><span style="font-size: 1.5em;">👤</span>Perfil</button>
        </nav>
    </div>
    <script src="app.js"></script>
</body>
</html>
